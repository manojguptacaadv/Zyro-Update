<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091420" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="60%" stop-color="#00B074" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Background Tile -->
  <rect width="512" height="512" rx="120" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="116" fill="none" stroke="#00B074" stroke-opacity="0.3" stroke-width="4" />
  <circle cx="256" cy="256" r="170" fill="#00B074" fill-opacity="0.08" />

  <!-- Zyro 'Z' Dynamic Path -->
  <path
    d="M130 160 H382 L150 352 H382"
    fill="none"
    stroke="url(#emeraldGrad)"
    stroke-width="48"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- High-Speed Dash Line -->
  <path
    d="M236 220 L300 300"
    fill="none"
    stroke="#FBBF24"
    stroke-width="32"
    stroke-linecap="round"
  />

  <!-- High Voltage EV Lightning Bolt -->
  <polygon
    points="280,110 216,250 274,250 234,370 342,220 286,220"
    fill="#FBBF24"
    stroke="#D97706"
    stroke-width="4"
    filter="url(#glow)"
  />
</svg>
