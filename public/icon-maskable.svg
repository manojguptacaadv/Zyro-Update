<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091420" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="emeraldGradM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="60%" stop-color="#00B074" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Background for adaptive maskable safe-zone -->
  <rect width="512" height="512" fill="url(#bgm)" />
  <circle cx="256" cy="256" r="140" fill="#00B074" fill-opacity="0.1" />

  <!-- Zyro 'Z' in safe center zone (scaled to fit within 75% circle) -->
  <path
    d="M160 180 H352 L175 332 H352"
    fill="none"
    stroke="url(#emeraldGradM)"
    stroke-width="38"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- High-Speed Dash Line -->
  <path
    d="M242 230 L292 290"
    fill="none"
    stroke="#FBBF24"
    stroke-width="24"
    stroke-linecap="round"
  />

  <!-- High Voltage EV Lightning Bolt -->
  <polygon
    points="272,130 224,242 270,242 238,340 324,218 278,218"
    fill="#FBBF24"
    stroke="#D97706"
    stroke-width="3"
  />
</svg>
