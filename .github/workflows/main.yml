name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
  
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Recreate Android project
        run: |
          rm -rf android
          npx cap add android
    
      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Check Android files
        run: |
          pwd
          ls -la android/app/src/main
          test -f android/app/src/main/AndroidManifest.xml

      - name: Build APK
        run: ./android/gradlew -p android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zyro-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
